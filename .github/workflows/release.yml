name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  GOFLAGS: -mod=mod
  GOPROXY: https://proxy.golang.org,direct
  GOSUMDB: sum.golang.org
  GOTOOLCHAIN: auto
  WAILS3_VERSION: v3.0.0-beta.12
  CANONICAL_REPOSITORY: zachlagden/tcno-acc-switcher
  RELEASE_BRANCH: main

jobs:
  release-gate:
    name: Release gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      allowed: ${{ steps.gate.outputs.allowed }}

    steps:
      - name: Checkout tag and release branch history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify the tag is on the release branch
        id: gate
        shell: bash
        run: |
          set -euo pipefail
          allowed=false
          canonical="${CANONICAL_REPOSITORY,,}"
          repository="${GITHUB_REPOSITORY,,}"
          if [[ "$repository" != "$canonical" ]]; then
            reason="repository '$GITHUB_REPOSITORY' is not '$CANONICAL_REPOSITORY'"
          elif [[ "$GITHUB_REF" != refs/tags/v* ]]; then
            reason="ref '$GITHUB_REF' is not a v* tag"
          else
            git fetch --force origin "$RELEASE_BRANCH:refs/remotes/origin/$RELEASE_BRANCH"
            tag_commit="$(git rev-parse "${GITHUB_REF}^{commit}")"
            branch_head="$(git rev-parse "refs/remotes/origin/$RELEASE_BRANCH^{commit}")"
            if git merge-base --is-ancestor "$tag_commit" "$branch_head"; then
              allowed=true
              reason="tag '$GITHUB_REF_NAME' targets $tag_commit on $RELEASE_BRANCH"
            else
              reason="tag '$GITHUB_REF_NAME' targets $tag_commit, which is not on $RELEASE_BRANCH"
            fi
          fi
          echo "allowed=$allowed" >> "$GITHUB_OUTPUT"
          echo "$reason"

  windows-release:
    name: Build, sign, and publish release
    needs: release-gate
    if: needs.release-gate.outputs.allowed == 'true'
    runs-on: windows-2022
    timeout-minutes: 90
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Verify release secret
        shell: pwsh
        env:
          UPDATER_KEY: ${{ secrets.UPDATER_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:UPDATER_KEY)) {
            throw 'Missing release secret UPDATER_KEY. Add the updater private key as a repository Actions secret.'
          }
          Write-Host 'Release secret is present.'

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true

      - name: Verify Go dependency policy
        run: go test ./internal/dependencypolicy

      - name: Verify updater
        run: go test ./internal/updatecheck

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install pnpm
        run: npm install -g pnpm@11.0.8

      - name: Install Windows packaging tools
        shell: pwsh
        run: |
          choco install nsis 7zip -y --no-progress
          $nsis = "${env:ProgramFiles(x86)}\NSIS"
          $sevenZip = "$env:ProgramFiles\7-Zip"
          $env:Path = "$nsis;$sevenZip;$env:Path"
          Add-Content -Path $env:GITHUB_PATH -Value $nsis
          Add-Content -Path $env:GITHUB_PATH -Value $sevenZip
          & "$env:GITHUB_WORKSPACE\other\NSIS\nsis7zplugin.ps1"

      - name: Install Wails CLI
        shell: pwsh
        run: |
          $goBin = Join-Path $env:USERPROFILE "go\bin"
          $env:Path = "$goBin;$env:Path"
          Add-Content -Path $env:GITHUB_PATH -Value $goBin
          go install "github.com/wailsapp/wails/v3/cmd/wails3@$env:WAILS3_VERSION"

      - name: Prepare release version
        shell: pwsh
        run: .\other\github-release.ps1 -Step PrepareVersion

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Generate Wails bindings
        run: wails3 generate bindings -f "-tags production,devtools" -clean=true -ts

      - name: Build frontend
        working-directory: frontend
        env:
          PRODUCTION: "true"
        run: pnpm run build

      - name: Build executable
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path bin\build | Out-Null
          Push-Location build
          wails3 generate syso -arch amd64 -icon ..\other\NSIS\img\icon.ico -manifest windows/wails.exe.manifest -info windows/info.json -out ..\wails_windows_amd64.syso
          Pop-Location
          go build -tags production,devtools -trimpath -buildvcs=false -ldflags="-w -s -H windowsgui" -o bin\build\TcNo-Acc-Switcher.exe
          Remove-Item -Force *.syso

      - name: Sign for the updater and package
        shell: pwsh
        env:
          UPDATER_KEY: ${{ secrets.UPDATER_KEY }}
        run: .\other\github-release.ps1 -Step PackageInstaller -SignedExePath "$env:GITHUB_WORKSPACE\bin\build\TcNo-Acc-Switcher.exe"

      - name: Verify release artifacts
        shell: pwsh
        run: .\other\github-release.ps1 -Step VerifyReleaseArtifacts -SignedInstallerPath "$env:UNSIGNED_INSTALLER_PATH"

      - name: Stage installer, catalogs and release notes
        shell: pwsh
        run: |
          Copy-Item -Force "$env:UNSIGNED_INSTALLER_PATH" "bin\TcNo Account Switcher Installer.exe"
          Copy-Item -Force Platforms.json, Platforms.mac.json, Platforms.linux.json bin\
          $version = $env:GITHUB_REF_NAME -replace '^v', ''
          $lines = Get-Content CHANGELOG.md
          $start = ($lines | Select-String -SimpleMatch "## [$version]" | Select-Object -First 1).LineNumber
          if (-not $start) { throw "CHANGELOG.md has no entry for $version" }
          $rest = $lines[$start..($lines.Count - 1)]
          $next = ($rest | Select-String -Pattern '^## \[' | Select-Object -First 1).LineNumber
          $body = if ($next) { $rest[0..($next - 2)] } else { $rest }
          $body | Out-File -Encoding utf8 release-notes.md

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          prerelease: false
          name: TcNo Account Switcher ${{ github.ref_name }}
          body_path: release-notes.md
          fail_on_unmatched_files: true
          files: |
            bin/TcNo Account Switcher Installer.exe
            bin/TcNo-Acc-Switcher.exe
            bin/TcNo-Acc-Switcher.exe.sig
            bin/TcNo-Acc-Switcher.7z
            bin/SHA256SUMS
            bin/Platforms.json
            bin/Platforms.mac.json
            bin/Platforms.linux.json
